<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ยินดีต้อนรับเข้าสู่เว็บไซต์ของฉัน</title>

  <!-- ดึง Bootstrap ผ่าน Vite & SCSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <!-- แถบหัวเว็บสีดำ -->
  <header class="container-fluid bg-dark text-white text-center py-4 mb-4">
    <div class="row">
      <div class="col-12">
        <h1>ยินดีต้อนรับเข้าสู่เว็บไซต์ของฉัน</h1>
      </div>
    </div>
  </header>

  <!-- ข้อมูลเนื้อหาหลัก -->
  <article class="container mb-5">
    <!-- ข้อมูลส่วนตัว -->
    <header class="mb-3">
      <p class="mb-1"><strong>ชื่อ:</strong> วิว สิรภัทร</p>
      <p class="mb-1"><strong>อายุ:</strong> 15 ปี</p>
      <p class="mb-1"><strong>เพศ:</strong> หญิง</p>
      <p class="mb-1"><strong>จังหวัด:</strong> สิงห์บุรี</p>
      <p class="mb-1"><strong>สถานะ:</strong> นักศึกษาปี 2</p>
    </header>

    <hr class="my-4">

    <!-- แบ่งเป็น 2 คอลัมน์ซ้าย-ขวา ด้วย row และ col-6 -->
    <div class="row">
      <!-- คอลัมน์ที่ 1: สิ่งที่ชอบ -->
      <section class="col-6 bg-info p-3 rounded">
        <h3>สิ่งที่ชอบ</h3>
        <ul>
          <li>ประถมศึกษา</li>
          <li>มัธยมศึกษา</li>
          <li>มหาวิทยาลัย</li>
        </ul>
      </section>

      <!-- คอลัมน์ที่ 2: สิ่งที่ไม่ชอบ -->
      <section class="col-6 bg-secondary text-white p-3 rounded">
        <h3>สิ่งที่ไม่ชอบ</h3>
        <ul>
          <li>ตัวเอง</li>
          <li>โค้ด</li>
          <li>คอม</li>
        </ul>
      </section>
    </div>
  </article>

  <!-- ส่วนท้ายเว็บ (อยู่นอก article) -->
  <footer class="container-fluid bg-dark text-white text-center p-4">
    <p class="mb-0">เว็บไซต์ส่วนตัวของ สิรภัทร (วิว) &copy; 2026</p>
  </footer>

  <!-- สคริปต์หลักสำหรับ Vite -->
  <script type="module" src="/src/main.js"></script>
</body>

</html>
